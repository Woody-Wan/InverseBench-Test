name: DMPlug
method:
  _target_: algo.dmplug.DMPlug

  diffusion_scheduler_config:
    num_steps: 3
    schedule: 'vp'
    timestep: 'vp'
    scaling: 'vp'

  guidance_scale: 1.0
  lr: 1e-2
  weight_decay: 0.0
  iteration: 1000
  # residual: DPS-style normalized sqrt(loss) update
  # none: use forward_op.gradient exactly, matching inversebench's operator loss
  # mse: upstream-style mean reduction; for multi-coil MRI this usually needs a much larger guidance_scale
  loss_scaling: residual
  # Set to e.g. 100 to print torch_mse gradient norm/cosine while using residual/external guidance.
  grad_check_interval: 0
